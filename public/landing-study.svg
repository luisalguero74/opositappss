<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Subtle background wash -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#g)"/>

  <!-- Desk line -->
  <path d="M140 680H1460" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6"/>

  <!-- Person (left) studying -->
  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <!-- head -->
    <path d="M360 370c0 44-36 80-80 80s-80-36-80-80 36-80 80-80 80 36 80 80Z"/>
    <!-- body/shoulders -->
    <path d="M210 520c18-34 44-54 70-54s52 20 70 54"/>
    <path d="M230 540c0 58 24 104 50 104s50-46 50-104"/>
    <!-- arms -->
    <path d="M238 575c-34 30-58 64-72 102"/>
    <path d="M322 575c38 26 64 58 82 98"/>
  </g>

  <!-- Open book in front of person -->
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 640c44-20 88-20 132 0"/>
    <path d="M240 640v80"/>
    <path d="M372 640v80"/>
    <path d="M306 630v92"/>
  </g>

  <!-- Stack of books (center) -->
  <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700 620h220"/>
    <path d="M710 590h220"/>
    <path d="M720 560h220"/>
    <path d="M730 530h220"/>
    <path d="M740 500h220"/>
    <path d="M760 500v120"/>
    <path d="M880 500v120"/>
  </g>

  <!-- Person (right) reading notes -->
  <g stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <!-- head -->
    <path d="M1360 390c0 39-31 70-70 70s-70-31-70-70 31-70 70-70 70 31 70 70Z"/>
    <!-- neck/body -->
    <path d="M1235 520c20-32 45-50 55-50s35 18 55 50"/>
    <path d="M1248 545c6 56 22 98 42 116"/>
    <path d="M1332 545c-6 56-22 98-42 116"/>
    <!-- arms holding paper -->
    <path d="M1218 610c34 6 64 18 90 34"/>
    <path d="M1352 610c-32 10-60 22-84 38"/>
  </g>

  <!-- Notes sheet -->
  <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1270 620h120v120h-120z"/>
    <path d="M1288 650h84"/>
    <path d="M1288 678h84"/>
    <path d="M1288 706h60"/>
  </g>

  <!-- Small accent icons: pen + checkmarks -->
  <g stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 740l60-30"/>
    <path d="M580 710l20 40"/>
    <path d="M980 700l18 18 36-42"/>
    <path d="M1040 700l18 18 36-42"/>
  </g>
</svg>
